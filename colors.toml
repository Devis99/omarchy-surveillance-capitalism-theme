# Four words only. The terminal speaks the AI's classifications and nothing else:
# red threat, yellow admin, blue government, white irrelevant. Every other slot
# is a shade of one of those four: green (success) is irrelevant white, cyan is
# pale government blue, magenta is dark threat red, orange is deep admin yellow.
